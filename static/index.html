<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机械制造多Agent问答系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f4f1ec;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #2e7d5b;
    color: #fff;
    padding: 14px 20px;
    font-size: 17px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  header small { font-weight: 400; font-size: 12px; opacity: .9; margin-left: 8px; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .row.user { align-items: flex-end; }
  .row.bot  { align-items: flex-start; }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user { background: #2e7d5b; color: #fff; border-bottom-right-radius: 3px; }
  .bubble.bot  { background: #fff; color: #222; border: 1px solid #e6ded2; border-bottom-left-radius: 3px; }
  .steps {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 4px 0 6px;
  }
  .step {
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 20px;
    background: #eef4f0;
    color: #2e7d5b;
    border: 1px solid #cfdfd5;
  }
  .src {
    margin-top: 8px;
    font-size: 12px;
    color: #7a7f85;
    border-top: 1px dashed #e2ddd3;
    padding-top: 6px;
  }
  .tip { align-self: center; color: #8a8f94; font-size: 12px; margin: 4px 0; }
  footer { padding: 12px 20px; background: #fff; border-top: 1px solid #e6ded2; display: flex; gap: 10px; }
  #input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d5cdc0;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  #input:focus { border-color: #2e7d5b; }
  #send {
    padding: 10px 22px;
    background: #2e7d5b;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  #send:hover { background: #25684c; }
  #send:disabled { background: #a4b8ae; cursor: not-allowed; }
</style>
</head>
<body>
<header>机械制造多Agent问答系统<small>每个 Agent 干什么，会一步步展示</small></header>

<div id="chat">
  <div class="tip">可以这样问：主轴异响是什么原因 · 伺服电机选型要多大扭矩 · 液压油多久换一次</div>
</div>

<footer>
  <input id="input" type="text" placeholder="输入你的问题" autocomplete="off">
  <button id="send">发送</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addUser(text) {
  const row = document.createElement("div");
  row.className = "row user";
  row.innerHTML = '<div class="bubble user"></div>';
  row.firstChild.textContent = text;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function addBot(r) {
  const row = document.createElement("div");
  row.className = "row bot";
  const bubble = document.createElement("div");
  bubble.className = "bubble bot";

  // 四个 Agent 的步骤展示
  const steps = document.createElement("div");
  steps.className = "steps";
  steps.innerHTML =
    '<span class="step">① 意图识别：' + r.qtype + '</span>' +
    '<span class="step">② 检索：' + r.doc_count + ' 条</span>' +
    '<span class="step">③ 生成回答</span>' +
    '<span class="step">④ 质检</span>';
  bubble.appendChild(steps);

  const ans = document.createElement("div");
  ans.textContent = r.answer;
  bubble.appendChild(ans);

  if (r.sources && r.sources.length) {
    const src = document.createElement("div");
    src.className = "src";
    src.textContent = "资料来源：" + r.sources.join("、");
    bubble.appendChild(src);
  }

  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  addUser(q);
  input.value = "";
  sendBtn.disabled = true;
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q })
    });
    addBot(await res.json());
  } catch (e) {
    addBot({ qtype: "服务出错", doc_count: 0, answer: "请确认 python webapp.py 正在运行。", sources: [] });
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", ask);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>

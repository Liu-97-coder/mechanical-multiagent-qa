<script>
/* 机械制造多 Agent 问答系统 —— 浏览器端逻辑
 * 与 Python 版 agents.py / rag.py / webapp.py 的算法一一对应（2-gram + IDF 检索、四环节编排、质检）。
 * 不依赖 DOM，可在 Node 里直接 require 做对照测试。
 */
(function (g) {
  "use strict";

  /* ---------- rag.py：字符 2-gram + IDF 检索 ---------- */
  function bigrams(text) {
    var chars = text.match(/[\u4e00-\u9fa5A-Za-z0-9]/g) || [];
    var set = new Set();
    for (var i = 0; i < chars.length - 1; i++) set.add(chars[i] + chars[i + 1]);
    return set;
  }

  function createIndex(docs) {
    var n = docs.length;
    var docGrams = docs.map(function (d) { return bigrams(d.text); });
    var df = new Map();
    docGrams.forEach(function (grams) {
      grams.forEach(function (gr) { df.set(gr, (df.get(gr) || 0) + 1); });
    });
    var idf = new Map();
    df.forEach(function (c, gr) { if (c < n) idf.set(gr, Math.log(n / c)); });

    function search(query, topK) {
      topK = topK || 3;
      var qGrams = bigrams(query);
      var scored = [];
      docs.forEach(function (d, i) {
        var hits = [];
        qGrams.forEach(function (gr) {
          if (docGrams[i].has(gr) && idf.has(gr)) hits.push(gr);
        });
        // 至少命中 2 个独特字组才算相关，避免单字误命中
        if (hits.length >= 2) {
          var s = 0;
          hits.forEach(function (gr) { s += idf.get(gr); });
          scored.push([s, i]);
        }
      });
      if (!scored.length) return [];
      scored.sort(function (a, b) { return b[0] - a[0]; });
      var seen = new Set(), out = [];
      for (var k = 0; k < scored.length; k++) {
        var d = docs[scored[k][1]];
        if (seen.has(d.source)) continue;
        seen.add(d.source);
        out.push(d);
        if (out.length >= topK) break;
      }
      return out;
    }

    return { docs: docs, search: search, _idf: idf };
  }

  /* ---------- agents.py：四个 Agent ---------- */
  var TYPE_KEYWORDS = [
    ["故障诊断", ["故障", "异响", "报警", "报错", "漏油", "不启动", "异常", "过热", "过载", "震动"]],
    ["参数选型", ["选型", "参数", "规格", "多大", "扭矩", "功率", "转速", "型号", "匹配"]],
    ["维护保养", ["保养", "维护", "多久换", "更换", "润滑", "加注", "检查周期", "清洁"]]
  ];

  function detectIntent(question) {
    for (var i = 0; i < TYPE_KEYWORDS.length; i++) {
      var kws = TYPE_KEYWORDS[i][1];
      for (var j = 0; j < kws.length; j++) {
        if (question.indexOf(kws[j]) !== -1) return TYPE_KEYWORDS[i][0];
      }
    }
    return "其他";
  }

  function generate(question, qtype, docs) {
    if (!docs.length) return "知识库里暂时没有找到相关的资料，请换个说法试试。";
    var lines = docs.map(function (d, i) { return (i + 1) + ". " + d.text.trim(); });
    var head = "根据知识库，关于「" + qtype + "」的问题，查到以下相关信息：\n";
    var tail = "\n（以上内容来自知识库检索，若有具体设备型号请补充后再查更准。）";
    return head + lines.join("\n") + tail;
  }

  var VAGUE_GRAMS = new Set([
    "是什", "什么", "么原", "原因", "怎么", "么办", "如何", "为什么",
    "问题", "处理", "检查", "一个", "这个", "那个", "需要", "是否",
    "应该", "可能", "一般", "进行", "出现", "情况", "时候", "多少",
    "多久", "几种", "哪些", "帮忙", "一下"
  ]);

  function verify(question, answer, qtype, hasDocs) {
    if (!hasDocs) return answer;
    var core = [];
    bigrams(question).forEach(function (gr) { if (!VAGUE_GRAMS.has(gr)) core.push(gr); });
    if (!core.length) return answer;
    var covered = 0;
    core.forEach(function (gr) { if (answer.indexOf(gr) !== -1) covered++; });
    if (covered / core.length < 0.5) {
      return answer + "\n\n[自查] 回答可能没覆盖到你问的核心内容，建议补充设备型号或更详细现象。";
    }
    return answer;
  }

  /* ---------- webapp.py：串起四步 ---------- */
  function process_(question, index) {
    var qtype = detectIntent(question);
    var docs = index.search(question, 3);
    var answer = generate(question, qtype, docs);
    answer = verify(question, answer, qtype, docs.length > 0);
    return {
      qtype: qtype,
      doc_count: docs.length,
      answer: answer,
      sources: docs.map(function (d) { return d.source; })
    };
  }

  var api = {
    bigrams: bigrams,
    createIndex: createIndex,
    detectIntent: detectIntent,
    generate: generate,
    verify: verify,
    process: process_
  };

  if (typeof module !== "undefined" && module.exports) module.exports = api;
  g.MechCore = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* 机械制造多 Agent 问答系统 —— 页面交互 */
(function () {
  "use strict";

  var chat = document.getElementById("chat");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var chips = document.getElementById("chips");
  var index = MechCore.createIndex(window.__MECH_KB__);

  var SAMPLES = [
    "主轴异响是什么原因",
    "伺服电机选型要多大扭矩",
    "液压油多久换一次",
    "导轨卡滞怎么办",
    "今天天气怎么样"
  ];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function scroll() { chat.scrollTop = chat.scrollHeight; }

  function addUser(text) {
    var row = el("div", "row user");
    row.appendChild(el("div", "bubble user", text));
    chat.appendChild(row);
    scroll();
  }

  function addBot(r) {
    var row = el("div", "row bot");
    var bubble = el("div", "bubble bot");

    var steps = el("div", "steps");
    steps.appendChild(el("span", "step", "① 意图识别：" + r.qtype));
    steps.appendChild(el("span", "step", "② 检索：" + r.doc_count + " 条"));
    steps.appendChild(el("span", "step", "③ 生成回答"));
    steps.appendChild(el("span", "step", "④ 质检"));
    bubble.appendChild(steps);

    bubble.appendChild(el("div", "ans", r.answer));

    if (r.sources && r.sources.length) {
      bubble.appendChild(el("div", "src", "资料来源：" + r.sources.join("、")));
    }

    row.appendChild(bubble);
    chat.appendChild(row);
    scroll();
  }

  function ask(text) {
    var q = (text !== undefined ? text : input.value).trim();
    if (!q) return;
    addUser(q);
    input.value = "";
    var r = MechCore.process(q, index);
    addBot(r);
    input.focus();
  }

  SAMPLES.forEach(function (s) {
    var b = el("button", "chip", s);
    b.type = "button";
    b.addEventListener("click", function () { ask(s); });
    chips.appendChild(b);
  });

  sendBtn.addEventListener("click", function () { ask(); });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") ask(); });

  // 截图/演示用：地址带 #demo 时自动问第一个示例
  if (location.hash === "#demo") ask(SAMPLES[0]);
})();

</script>
